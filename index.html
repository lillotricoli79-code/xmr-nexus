
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>XMR Nexus Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🚀 XMR Nexus</h1>
    <p>Dashboard per il mining di Monero</p>
  </header>

  <main>
    <section id="stats">
      <h2>Statistiche</h2>
      <div>Hashrate: <span id="hashrate">0 H/s</span></div>
      <div>Pool attivo: <span id="pool">Nessuno</span></div>
    </section>

    <section id="controls">
      <h2>Controlli</h2>
      <select id="poolSelect">
        <option value="MoneroOcean">MoneroOcean</option>
        <option value="HashVault">HashVault</option>
        <option value="MintMe">MintMe</option>
      </select>
      <button onclick="setPool()">Cambia Pool</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
