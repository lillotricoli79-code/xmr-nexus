

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XMR Nexus Dashboard</title>

  <!-- CSS corretto: styles.css -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Font e icone -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Librerie JS esterne -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="theme-dark">
  <header class="header">
    <div class="brand">
      <img src="src/logo.svg" alt="XMR Nexus" class="brand-logo" />
      <div class="brand-text">
        <h1>XMR Nexus</h1>
        <p>Dashboard avanzata per il mining di Monero</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="themeToggle" class="btn icon"><i class="fas fa-moon"></i><span>Dark</span></button>
      <button id="shareLink" class="btn icon"><i class="fas fa-share-alt"></i><span>Condividi</span></button>
      <span id="statusBadge" class="badge badge-warn">Demo</span>
    </div>
  </header>

  <main class="container">
    <!-- Qui vanno le sezioni della dashboard (panoramica, grafici, worker, ecc.) -->
    <section class="card">
      <div class="card-header"><h2><i class="fas fa-gauge-high"></i> Panoramica</h2></div>
      <div class="stats-grid">
        <div class="stat"><span class="stat-label"><i class="fas fa-bolt"></i> Hashrate</span><span class="stat-value" id="hashrate">0 H/s</span></div>
        <div class="stat"><span class="stat-label"><i class="fas fa-server"></i> Pool</span><span class="stat-value" id="pool">N/A</span></div>
        <div class="stat"><span class="stat-label"><i class="fas fa-users"></i> Worker</span><span class="stat-value" id="workers">0</span></div>
        <div class="stat"><span class="stat-label"><i class="fas fa-check-circle"></i> Accepted</span><span class="stat-value" id="accepted">0</span></div>
        <div class="stat"><span class="stat-label"><i class="fas fa-times-circle"></i> Rejected</span><span class="stat-value" id="rejected">0</span></div>
        <div class="stat"><span class="stat-label"><i class="fas fa-clock"></i> Uptime</span><span class="stat-value" id="uptime">00:00:00</span></div>
      </div>
      <div id="statusMsg" class="status-msg"></div>
    </section>
  </main>

  <footer class="footer">
    <span>Monero only • XMR Nexus</span>
  </footer>

  <!-- JS corretto: App.js -->
  <script src="App.js"></script>
</body>
</html>
