<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Monero logo background">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0c0f12"/>
      <stop offset="100%" stop-color="#12161b"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a1a"/>
      <stop offset="100%" stop-color="#ff6600"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur" mode="screen"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>

  <!-- monero emblem -->
  <g transform="translate(112,112)" filter="url(#softGlow)">
    <!-- outer circle -->
    <circle cx="400" cy="400" r="360" fill="none" stroke="#1b2129" stroke-width="20"/>
    <circle cx="400" cy="400" r="340" fill="#0f1318" stroke="#222a33" stroke-width="2"/>
    <!-- top arc accent -->
    <path d="M60,400 A340,340 0 1,1 740,400" fill="none" stroke="url(#accent)" stroke-width="40" stroke-linecap="round"/>
    <!-- monero M mark -->
    <g transform="translate(180,250)">
      <path d="M0,220 L0,0 L80,80 L160,0 L160,160 L240,80 L320,160 L320,0 L400,80 L400,220"
            fill="none" stroke="#ff6600" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- base bar -->
      <rect x="0" y="220" width="400" height="36" rx="18" fill="#ff6600"/>
    </g>
    <!-- subtle rings -->
    <circle cx="400" cy="400" r="300" fill="none" stroke="#1c222b" stroke-width="6"/>
    <circle cx="400" cy="400" r="280" fill="none" stroke="#171d24" stroke-width="4"/>
  </g>

  <!-- watermark text -->
  <g opacity="0.14">
    <text x="50%" y="94%" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="42" fill="#ff6600">XMR Nexus</text>
  </g>
</svg>
